[pytest]
# Turnus Risk Audit - Pytest Configuration

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    adversarial: marks adversarial/chaos tests
    integration: marks integration tests

# Output
addopts =
    -v
    --tb=short
    --strict-markers

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Coverage (when used with --cov)
# Run: pytest --cov=logic --cov-report=term-missing
